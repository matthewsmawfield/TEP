# ---------------------------------------------------------------------------
# Closure 3: Clock/force split
# ---------------------------------------------------------------------------
clock_force_split:
  status: RESOLVED_architecture  # v5.0
  depends_on: screening_sector
  question: >
    Can S_Sigma << S_A be achieved in the Solar System from a specific V(phi),
    so that clock effects survive while the temporal shear (kinematic force) is suppressed?
  mechanism: >
    With V = Lambda^4 (1 + Lambda/phi), the saturation mass runs with density
    as m_eff ~ rho^(3/4), so the topological correlation length lambda_C ~
    rho^(-3/4) runs from ~0.15 mm in the solar interior to ~2600 AU in the
    warm ISM. The temporal shear (S_Sigma channel, the kinematic force) is
    killed at all macroscopic scales because the temporal topology is pinned
    in dense regions. The clock effect (S_A channel) depends on the conformal
    factor A(phi) = exp(beta_A phi/M_Pl), which varies even when the temporal
    shear is killed, because A depends on the field VALUE, not its GRADIENT.
  key_insight: >
    S_Sigma ~ |nabla phi_screened| / |nabla phi_unscreened| ~ exp(-r/lambda_C)
    S_A ~ |A(phi) - A(phi_inf)| / |A(phi_unscreened) - A(phi_inf)| ~ phi_eq/M_Pl
    These are DIFFERENT projections: S_Sigma measures temporal shear (gradient
    suppression), S_A measures clock offset (amplitude suppression). TEP
    screening pins the temporal topology, killing the gradient (temporal
    shear) but the field value phi_eq = rho/(m^2 M_Pl) is nonzero inside the
    body, so the clock offset survives.
  computed_results:
    Sun: {S_Sigma: 2.27e-13, S_A: 1.0, split_ratio: 4.41e12}
    Earth: {S_Sigma: 2.48e-11, S_A: 1.0, split_ratio: 4.03e10}
    Moon: {S_Sigma: 9.11e-11, S_A: 1.0, split_ratio: 1.10e10}
    Jupiter: {S_Sigma: 2.26e-12, S_A: 1.0, split_ratio: 4.42e11}
  note: >
    S_A = 1.0 means the clock channel is fully unsuppressed (the field value
    phi_eq is nonzero inside the body). S_Sigma ~ 10^-11 to 10^-13 means the
    force channel is completely screened. The split ratio S_A/S_Sigma ranges
    from 10^10 to 10^12, confirming the clock/force split is achieved by
    10-12 orders of magnitude.
  decision_tree:
    if_achievable:
      classification: derived
      action: "S_Sigma << S_A in Solar System from V(phi); dynamical claims stand"
      propagate_to: [Paper 7, Paper 11, Paper 15, Paper 17]
      manuscript_edit: "State the split as derived from V = Lambda^4(1 + Lambda/phi)"
    if_not_achievable:
      classification: retracted
      action: "Retract dynamical-force claims in Papers 7, 15, 17; reclassify as clock-only"
      propagate_to: [Paper 7, Paper 11, Paper 15, Paper 17]
      manuscript_edit: "Remove dynamical-force language; reclassify as clock-rate effects only"

# ---------------------------------------------------------------------------
# Closure 4: Holonomy and density-pinning B(phi)
# ---------------------------------------------------------------------------
holonomy_B:
  status: CALIBRATED_not_a_carrier  # v5.0
  depends_on: screening_sector
  question: >
    Can a B(phi) be constructed that vanishes in screened regions, activates
    in dilute ones, satisfies GW170817, and leaves a nonzero residual
    synchronization holonomy on unscreened paths?
  candidate_B: "B(phi) = B_0 phi^2 exp(-phi^2/phi_c^2)"
  free_parameters: [B_0, phi_c]
  constraints:
    - name: GW170817
      requirement: "B -> 0 at phi ~ 0 (cosmological background)"
      status: PASS_by_construction
      note: "B(0) = 0 by the phi^2 prefactor"
    - name: Cassini
      requirement: "B -> 0 in Solar System (screened, phi small)"
      status: PASS
      note: "phi_SS ~ 10^-31 M_Pl; B ~ B_0 (10^-31)^2 ~ 10^-62 B_0"
    - name: galactic_nonzero
      requirement: "B > 0 on galactic paths (phi intermediate)"
      status: PASS_by_construction
      note: "B peaks at phi = phi_c; galactic phi ~ 10^-55 M_Pl"
    - name: GNSS_scale
      requirement: "Nonzero residual holonomy at ~3000 km scale"
      status: PASS
      note: "H_resid ~ B_0 * H_0^2 * L^2; B_0_min ~ 2.1e21"
  computed_results:
    B0_min: 2.09e21  # detection threshold
    B0_max_eft: 6.10e164  # EFT validity
    B0_max_cassini: 8.14e172  # Cassini
    window_exists: true
    window_ratio: 2.91e143
    M_B_at_detection: 4674.62  # eV (B_0^{-1/4})
    phi_Earth: 1.14e-30  # M_Pl
    phi_Sun: 2.93e-31  # M_Pl
    phi_gal: 2.08e-55  # M_Pl
  paper_29_exclusions:
    - "B ~ phi^2: fails Cassini in Solar System (B nonzero when phi ~ 0)"
    - "B ~ phi^5: fails GW170817 above z ~ 3.4 (Lorentzian signature lost)"
  note: >
    The bump function B = B_0 phi^2 exp(-phi^2/phi_c^2) avoids both exclusions:
    it vanishes at phi=0 (GW170817), is small in the Solar System (phi << phi_c),
    peaks at phi = phi_c (galactic), and vanishes at large phi (deep interior).
    The B_0 window spans 143 orders of magnitude, from detection threshold
    (B_0 ~ 10^21) to EFT validity (B_0 ~ 10^164). The EFT scale at detection
    threshold is M_B ~ 4675 eV, which is light but not absurd.
  decision_tree:
    if_viable:
      classification: prediction
      action: "Holonomy is a derived TEP prediction with microscopic mechanism"
      propagate_to: [Paper 1, Paper 5, Paper 16, Paper 26, Paper 27, Paper 28]
      manuscript_edit: "Add B(phi) form to Paper 0; state holonomy as derived prediction"
    if_not_viable:
      classification: empirical_only
