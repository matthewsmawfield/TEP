      classification: retracted
      action: "H0 = 66.65 +/- 1.58 is a phenomenological fit; TEP carrier unidentified"
      propagate_to: [Paper 5, Paper 10, Paper 12, Paper 22, Paper 31]
      manuscript_edit: "Downgrade all H0 citations from 'TEP prediction' to 'consistent with TEP'"

