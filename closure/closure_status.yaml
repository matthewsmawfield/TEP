    status: static_linear_and_finite_excursion_responses_available
    scope: >-
      Corrected boundary-value profiles; body-dependent outer radii are recorded.
      This is not a universal transmission, a monthly lunar range transfer,
      or a cosmological host-evolution calculation. Earlier shooting-based
      transmission numbers and their downstream applications are superseded.
  landscape_transport:
    source: scripts/steps/step_78_landscape_transport.py
    expected_output: results/step_78_landscape_transport.json
    status: implementation_present_expected_output_not_located_in_reconciliation
