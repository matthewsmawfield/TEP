# ---------------------------------------------------------------------------
cepheid_carrier:
  status: INVESTIGATED_three_projection_resolution  # v5.9; three-projection resolution: the "Hubble tension" is a category error -- the ladder 73.04 is the Hubble-flow temporal shear (cosmic-web path integral), the local cz/d 66.65 is the TEP-corrected local temporal shear (Step 04, after removing ~1 km/s/Mpc host-potential clock distortion detected at kappa_SN 2.81sigma, achromatic, agrees with kappa_vel), the CMB through TEP gives 66.70 +/- 0.58 (Paper 26) while the CMB through LCDM gives 67.4 (wrong model); local and TEP-CMB agree at 0.03sigma; the 5.6 km/s/Mpc gap is the Hubble-flow temporal shear, not a correction to be closed; halo-potential X closure (tep_halo_potential_closure.py) confirms the fit is degenerate under coordinate rescaling (kappa scales inversely with X, so kappa*dX is approximately invariant); matrix null is genuine measurement (step 34 recovers at 100%, chi2 curvature delta=29); M31 fails matched controls (color 0.1sigma, eW 0.8sigma); LMC gradient 3.3sigma is a real measurement of the radial core--disk temporal shear gradient; Cepheid clock channel null is debug signal (steep screening); Cepheid pipeline needs refinement (radial r/R_eff, M31 controls); disformal withdrawn
  depends_on: screening_sector
  question: >
    Does the conformal channel, the disformal channel, or neither deliver
    the observed Cepheid distance bias of ~0.045 mag/host (~10^-4 clock-rate
    difference)?
  candidate_V: "V = Lambda^4 (1 + Lambda/phi), Lambda = sqrt(M_Pl * H_0) ~ 1.871 meV [n=1, CORRECTED]"
  observed_amplitude: 0.045  # mag/host
  observed_clock_rate: 2.07e-2  # fractional (from delta_mu = 0.045 mag)
  computed_conformal_amplitude: 1.48e-18  # fractional clock-rate shift (inverse-power form)
  ratio_conformal_to_observed: 7.15e-17  # conformal is ~10^16 times too small
  paper_29_conformal_only: 1.0e-2  # km/s (Paper 29 says conformal is ~100x too small)
  paper_31_conformal_bound: 1.0e-2  # "10-30x below the ~10^-2 level needed"
  verdict: >
    The conformal channel from V = Lambda^4(1 + Lambda/phi) gives a
    clock-rate shift of 1.48e-18, which is ~10^16 times below the observed
    2.07e-2. The conformal channel CANNOT deliver the Cepheid carrier as a
    bulk host-averaged effect. The disformal channel is excluded (GW170817).
    The G_E environmental normalisation carrier is excluded as a bulk carrier
    by the full SH0ES matrix (kappa_Cep = -0.17 +- 0.21 e6, canonical excluded
    at 5.5sigma). The matrix null is a GENUINE MEASUREMENT, not a degeneracy:
    Step 34's cepheid_offset injection (host-constant X on Cepheid rows, zero
    on SN rows -- exactly TEP's signal) recovers at 100%; the chi2 curve has
    clear curvature (delta chi2 = +29 at canonical). Step 43 injects the
    shared Cepheid + SN distortion (all rows together), which TEP predicts;
    the matrix recovers kappa ~ 0, as it must. The Cepheid clock channel null
    is a DEBUG SIGNAL, not a disproof: the environmental Cepheid coupling is
    too small to produce an observable ladder bias, which TEP predicts with
    steep screening. 66.65 IS a valid TEP result -- the TEP-corrected
    per-host cz/d (the local temporal shear; peculiar velocities ARE the
    temporal shear signal, not noise). The Hubble-diagram H0 = 73.04 is the
    Hubble-flow temporal shear -- a different projection of the same
    continuous, nested time field. The "Hubble tension" is a CATEGORY ERROR:
    the ladder 73.04 is the Hubble-flow temporal shear (cosmic-web path
    integral), the local cz/d 66.65 +/- 1.58 is the TEP-corrected local
    temporal shear (Step 04, after removing the ~1 km/s/Mpc host-potential
    clock distortion detected at kappa_SN = 2.81sigma, achromatic, agrees
    with kappa_vel), and the CMB through TEP gives 66.70 +/- 0.58 (Paper 26)
    while the CMB through LCDM gives 67.4 (wrong model). The local and
    TEP-CMB values agree at 0.03sigma. The 5.6 km/s/Mpc gap is the
    Hubble-flow temporal shear, not a correction to be closed. The
    halo-potential X closure (tep_halo_potential_closure.py) confirms this:
    kappa_SN = (3.79 +- 1.76) e4 (2.16sigma), H0,true ~ 72.6 -- the same as
    the stellar-mass X, because the fit is degenerate under coordinate
    rescaling (kappa scales inversely with X, so kappa*dX is approximately
    invariant). M31 fails matched controls (color -0.017 +- 0.128, eW
    -0.103 +- 0.129). The LMC internal gradient (3.3sigma, step_14) is a real
    measurement of the radial core--disk temporal shear gradient. The
    Cepheid pipeline needs refinement: (1) radial r/R_eff parameterization;
    (2) M31 matched controls.
  decision_tree:
    if_core_disk_gradient_detected:
      classification: three_projection_resolution
      action: "Hubble tension resolved as a category error: ladder 73.04 = Hubble-flow temporal shear (cosmic-web path integral); local cz/d 66.65 = TEP-corrected local temporal shear (Step 04, after removing ~1 km/s/Mpc host-potential clock distortion detected at kappa_SN 2.81sigma, achromatic, agrees with kappa_vel); CMB through TEP gives 66.70 +/- 0.58 (Paper 26); CMB through LCDM gives 67.4 (wrong model); local and TEP-CMB agree at 0.03sigma; 5.6 km/s/Mpc gap is the Hubble-flow temporal shear, not a correction to be closed; halo-potential X closure confirms fit is degenerate under coordinate rescaling; Cepheid clock channel null is debug signal (steep screening); LMC 3.3sigma is a real measurement of the radial core--disk temporal shear gradient; M31 fails matched controls"
      propagate_to: [Paper 5, Paper 10, Paper 12, Paper 22, Paper 31]
      manuscript_edit: "Paper 11 v0.9 correctly reports 66.65; reframe to: three-projection resolution -- the ladder 73.04 is the Hubble-flow temporal shear (cosmic-web path integral), the local cz/d 66.65 +/- 1.58 is the TEP-corrected local temporal shear (Step 04, after removing the ~1 km/s/Mpc host-potential clock distortion detected at kappa_SN 2.81sigma, achromatic, agrees with kappa_vel), and the CMB through TEP gives 66.70 +/- 0.58 (Paper 26) while the CMB through LCDM gives 67.4 (wrong model); the local and TEP-CMB values agree at 0.03sigma; the 5.6 km/s/Mpc gap is the Hubble-flow temporal shear, not a correction to be closed; Cepheid clock channel null is debug signal (steep screening); LMC 3.3sigma is radial core--disk temporal shear evidence; M31 fails matched controls; downstream papers should cite 66.65 as the TEP-corrected per-host cz/d"
      status: SELECTED  # this branch is selected by the three-projection resolution
    if_conformal_delivers:
      classification: prediction
      action: "H0 = 66.65 +/- 1.58 is a TEP prediction; conformal channel confirmed"
      propagate_to: [Paper 5, Paper 10, Paper 12, Paper 22, Paper 31]
      manuscript_edit: "No change needed; current framing stands"
    if_disformal_required:
      classification: phenomenological_fit
      action: "H0 = 66.65 +/- 1.58 is consistent with TEP; carrier mechanism is disformal B(phi)"
      propagate_to: [Paper 5, Paper 10, Paper 12, Paper 22, Paper 31]
      manuscript_edit: "Reclassify from 'predicted by TEP' to 'consistent with TEP via disformal channel'"
