    force_normalization: >-
      Reconcile the source-gradient test-probe limit with the finite-pair
      benchmark before applying either to a lens aperture; no replacement
      screening power is selected by this reconciliation.
    efa_scores: >-
      Archived template scores retain their fitting convention. Verification
      of the full prediction-dependent-variance likelihood optimum and nuisance
      accounting is separate from the coherent-link cancellation result.
    lens_scores: >-
      Step 60 diagonal pooling is descriptive; shared-image covariance and
      joint ratio uncertainty are required for calibrated combined evidence.
    llr_transfer: >-
      The measured synodic residual remains distinct from a direct-fit SEP
      parameter and from a derived station/reflector field-to-range prediction.
    cosmological_tracking: >-
      The Pantheon luminosity-drift limit is conditional on the fitted distance
      model and source-luminosity prescription, not proof of universal pinning.

