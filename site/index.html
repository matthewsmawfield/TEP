    <meta name="dc.description" content="This paper proposes a covariant, testable reformulation of relativity in which proper time is a dynamical field and the &quot;speed of light&quot; is an emergent, strictly local invariant rather than a global constant. The framework is built on a single spacetime manifold endowed with two metrics: a gravitational metric g_{μν} and a causal (matter) metric g̃_{μν} to which all non-gravitational fields and clocks couple. The metrics are related by a controlled disformal map, g̃_{μν} = A²(φ) g_{μν} + B(φ) ∇_μφ ∇_νφ, where φ is the time field, A(φ) = exp(β_A φ/M_Pl) is a universal conformal factor, and B(φ) encodes tiny, direction-dependent deformations of the light cone consistent with GW170817-class multi-messenger constraints (|c_γ − c_g|/c ≲ few × 10^{-15} today). Proper time is elevated to a field by postulating that all matter, electromagnetism, and quantum phases evolve with respect to g̃-proper time τ; in local freely falling frames, this guarantees exact local Lorentz invariance and a locally invariant c, while globally it implies that synchronization procedures and one-way light-time measurements can become path-dependent in the disformal/non-exact sector of a dynamical-time background. The covariant action, field equations, conservation laws, and PPN mapping are developed; screening is formulated as continuous Temporal Topology, with the quartic density-dependent-mass branch providing an explicit microscopic completion of the Solar-System/interstellar screening requirements. The breakdown of global simultaneity is formalized using a synchronization-transport law, deriving a convention-independent &quot;synchronization holonomy,&quot; an invariant measure of non-integrability of time transport around closed loops. In the purely conformal subclass this holonomy vanishes after subtraction of the full GR, kinematic, clock-scale, and reference-frame synchronization model; nonzero holonomy at leading order requires residual non-exact synchronization structure, supplied in the minimal TEP model by disformal coupling B(φ)≠0, and in more general extensions by non-metricity or other explicitly non-exact transport structure.">

        /* ============================================

    <!-- Component Loading Script -->
    <script>
        // Component loading system
        async function loadManuscriptComponents() {
            try {
                // Load manifest
                const manifest = await fetch('manifest.json').then(r => r.json());

                // Get container elements
                const loadingDiv = document.getElementById('loading');
                const contentDiv = document.getElementById('manuscript-content');

                // Load each section in order
                for (const section of manifest.sections.sort((a, b) => a.order - b.order)) {
                    try {
                        const html = await fetch(`components/${section.file}`).then(r => r.text());

                        // Create section container
                        const sectionDiv = document.createElement('div');
                        sectionDiv.id = section.id;
                        sectionDiv.className = 'manuscript-section';
                        sectionDiv.setAttribute('data-section', section.title);
                        sectionDiv.innerHTML = html;

                        // Append to content container
                        contentDiv.appendChild(sectionDiv);

                        console.log(`Loaded section: ${section.title}`);
                    } catch (error) {
                        console.error(`Failed to load section ${section.title}:`, error);

                        // Create error placeholder
                        const errorDiv = document.createElement('div');
                        errorDiv.innerHTML = `<div style="background-color: #ffe6e6; border: 1px solid #ff9999; padding: 15px; margin: 20px 0; border-radius: 5px;">
                            <h3 style="color: #cc0000; margin-top: 0;">Error Loading Section: ${section.title}</h3>
                            <p>Failed to load <code>components/${section.file}</code></p>
                            <p style="font-size: 12px; color: #666;">Check console for details</p>
                        </div>`;
                        contentDiv.appendChild(errorDiv);
                    }
                }

                // Hide loading, show content
                loadingDiv.style.display = 'none';
                contentDiv.style.display = 'block';

                // Re-initialize features that depend on content being loaded
                initializePageFeatures();

                console.log('Manuscript loading complete');

            } catch (error) {
                console.error('Failed to load manuscript:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="background-color: #ffe6e6; border: 1px solid #ff9999; padding: 20px; border-radius: 5px;">
                        <h3 style="color: #cc0000; margin-top: 0;">Error Loading Manuscript</h3>
                        <p>Failed to load the manuscript components. Please check your network connection and try again.</p>
                        <p style="font-size: 12px; color: #666;">Error: ${error.message}</p>
                        <button onclick="location.reload()" style="background: #4A90C2; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Retry</button>
                    </div>
                `;
            }
        }

        // Initialize page features after content is loaded
        function initializePageFeatures() {
            // Re-render MathJax if present
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch(err => console.warn('MathJax rendering error:', err));
            }
        }

        // Load components when page is ready
        document.addEventListener('DOMContentLoaded', loadManuscriptComponents);

        // Trigger MathJax after components load, just in case
        setTimeout(function() {
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch(function (err) {
                    console.error('MathJax error:', err.message);
                });
            }
        }, 1000);

        // Change title for PDF filename when printing
        const originalTitle = document.title;
        const pdfTitle = 'TEP';
        window.addEventListener('beforeprint', () => { document.title = pdfTitle; });
        window.addEventListener('afterprint', () => { document.title = originalTitle; });
    </script>
